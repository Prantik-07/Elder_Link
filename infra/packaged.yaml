AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ElderLink Audio Processing Pipeline - S3 -> EventBridge -> Lambda 
  -> Transcription -> S3
Globals:
  Function:
    Timeout: 60
    Runtime: python3.11
    Environment:
      Variables:
        TRANSCRIPTION_PROVIDER: mock
        ELDERLINK_AWS_REGION: us-east-1
        BEDROCK_MODEL_ID: mistral.voxtral-mini-3b-2507
        AUDIO_BUCKET_NAME:
          Ref: AudioBucket
        MAX_AUDIO_SIZE_BYTES: 10485760
Resources:
  TranscriptionLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: elderlink-transcription-core
      Description: ElderLink transcription core module (TranscriptionProvider, 
        VoxtralProvider, MockTranscriptionProvider)
      ContentUri: 
        s3://elderlink-deploy-artifacts/7498f76fafe76fe0580b31c7cc7b109d
      CompatibleRuntimes:
      - python3.11
      RetentionPolicy: Retain
  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
  ProcessAudioFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: elderlink-process-audio
      CodeUri: s3://elderlink-deploy-artifacts/57edaa6eb664f529a979ae10c0ecc12c
      Handler: handler.lambda_handler
      Role:
        Fn::GetAtt:
        - ProcessAudioRole
        - Arn
      Layers:
      - Ref: TranscriptionLayer
      Environment:
        Variables:
          TRANSCRIPTION_PROVIDER: mock
          ELDERLINK_AWS_REGION: us-east-1
          BEDROCK_MODEL_ID: mistral.voxtral-mini-3b-2507
          AUDIO_BUCKET_NAME:
            Ref: AudioBucket
          MAX_AUDIO_SIZE_BYTES: 10485760
      Events:
        S3ObjectCreated:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
              - aws.s3
              detail-type:
              - Object Created
              detail:
                bucket:
                  name:
                  - Ref: AudioBucket
                object:
                  key:
                  - prefix: audio/
  ProcessAudioRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: ElderLinkS3Access
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - s3:GetObject
            Resource:
              Fn::Sub: ${AudioBucket.Arn}/audio/*
          - Effect: Allow
            Action:
            - s3:PutObject
            Resource:
              Fn::Sub: ${AudioBucket.Arn}/transcripts/*
      - PolicyName: ElderLinkBedrockAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - bedrock:InvokeModel
            Resource:
              Fn::Sub: 
                arn:aws:bedrock:us-east-1::foundation-model/mistral.voxtral-mini-3b-2507
  EventBridgeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: elderlink-s3-audio-created
      Description: Routes S3 Object Created events for audio/ prefix to 
        ProcessAudio Lambda
      EventPattern:
        source:
        - aws.s3
        detail-type:
        - Object Created
        detail:
          bucket:
            name:
            - Ref: AudioBucket
          object:
            key:
            - prefix: audio/
      State: ENABLED
      Targets:
      - Arn:
          Fn::GetAtt:
          - ProcessAudioFunction
          - Arn
        Id: ProcessAudioFunction
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: ProcessAudioFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn:
        Fn::GetAtt:
        - EventBridgeRule
        - Arn
Outputs:
  AudioBucketName:
    Description: Name of the S3 bucket for audio uploads and transcripts
    Value:
      Ref: AudioBucket
    Export:
      Name: ElderLink-AudioBucketName
  LambdaFunctionName:
    Description: Name of the ProcessAudio Lambda function
    Value:
      Ref: ProcessAudioFunction
    Export:
      Name: ElderLink-ProcessAudioFunctionName
  EventBridgeRuleName:
    Description: Name of the EventBridge rule
    Value:
      Ref: EventBridgeRule
    Export:
      Name: ElderLink-EventBridgeRuleName
  TranscriptionLayerArn:
    Description: ARN of the transcription core Lambda layer
    Value:
      Ref: TranscriptionLayer
    Export:
      Name: ElderLink-TranscriptionLayerArn
